<div class="mb-8">
    <div class="flex justify-center mb-6">
        <app-logo routerLink="/landing"/>
    </div>
    <h3 class="text-2xl font-bold text-center text-slate-900 dark:text-white">Create Account</h3>
    <p class="text-sm text-center text-slate-500 dark:text-slate-400 mt-1">Sign up to start tracking your expenses</p>
</div>
<form [formGroup]="registerForm" (ngSubmit)="register()">
    @if (errorMessage()!=null) {
        <ui-message-banner
            class="mb-4 h-10 block"
            [type]="MessageBannerType.Error"
            [text]="errorMessage()!"
        />
    }
    <form-control
        [name]="'Name'"
        [control]="nameControl"
    >
        <ui-input
        type="text"
        placeholder="Full name"
        formControlName="name"
        />
    </form-control>

    <form-control
        [name]="'Gender'"
        [control]="genderControl"
    >
        <select
            formControlName="gender"
            class="w-full h-10 px-3 rounded-md bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-1 outline-gray-300 dark:outline-slate-600 transition-colors focus:outline-2 focus:outline-primary-500"
        >
            <option [ngValue]="null" disabled>Select gender</option>
            <option [ngValue]="Gender.MALE">Male</option>
            <option [ngValue]="Gender.FEMALE">Female</option>
        </select>
    </form-control>

    <form-control
        [name]="'Date of Birth'"
        [control]="dobControl"
    >
        <ui-input
            type="date"
            placeholder="Date of birth"
            formControlName="dob"
        />
    </form-control>

    <form-control
        [name]="'Email'"
        [control]="emailControl"
    >
        <ui-input
        type="email"
        placeholder="Email"
        formControlName="email"
        />
    </form-control>

    <form-control
        [name]="'Password'"
        [control]="passwordControl"
    >
        <ui-input
        type="password"
        placeholder="Password"
        formControlName="password"
        />
    </form-control>

    <button uiButton variant="filled" size="md" class="w-full mt-2" type="submit">
        Create Account
    </button>
</form>
<ui-divider class="my-6" text="OR"/>
<button uiButton variant="outline" size="md" class="w-full" routerLink="../">
    Already have an account? Login
</button>
<p class="text-xs text-center text-slate-400 dark:text-slate-500 mt-6">
    By Continuing, you agree to our <a href="/terms" class="text-primary-600 hover:underline">Terms of Service</a> and <a href="/privacy" class="text-primary-600 hover:underline">Privacy Policy</a>.
</p>
