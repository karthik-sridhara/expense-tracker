<div class="w-full max-w-sm">
    <div class="mb-8">
        <div class="flex justify-center mb-6">
            <app-logo routerLink="/landing"/>
        </div>
        <h3 class="text-2xl font-bold text-center text-slate-900 dark:text-white">Change Password</h3>
        <p class="text-sm text-center text-slate-500 dark:text-slate-400 mt-1">
            Enter your current password and choose a new one.
        </p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
        @if (errorMessage()!=null) {
            <ui-message-banner
                class="mb-4 h-10 block"
                [type]="MessageBannerType.Error"
                [text]="errorMessage()!"
            />
        }
        @if (successMessage()!=null) {
            <ui-message-banner
                class="mb-4 h-10 block"
                [type]="MessageBannerType.Success"
                [text]="successMessage()!"
            />
        }

        <form-control [name]="'Current password'" [control]="currentPasswordControl">
            <ui-input
                icon="/icons/lock.svg"
                iconPosition="prefix"
                type="password"
                placeholder="Current password"
                formControlName="currentPassword"
                class="ps-0"
            />
        </form-control>

        <form-control [name]="'New password'" [control]="newPasswordControl">
            <ui-input
                icon="/icons/lock.svg"
                iconPosition="prefix"
                type="password"
                placeholder="New password"
                formControlName="newPassword"
                class="ps-0"
            />
        </form-control>

        <form-control [name]="'Confirm password'" [control]="confirmPasswordControl">
            <ui-input
                icon="/icons/lock.svg"
                iconPosition="prefix"
                type="password"
                placeholder="Confirm new password"
                formControlName="confirmPassword"
                class="ps-0"
            />
        </form-control>

        <button uiButton variant="filled" size="md" class="w-full mt-2" type="submit">
            Change Password
        </button>
    </form>
    <ui-divider class="my-6" text="OR"/>

    <button uiButton variant="outline" size="md" class="w-full mt-4" routerLink="../">
        Back to Login
    </button>
</div>
