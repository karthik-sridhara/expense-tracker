<main class="h-screen w-full flex">

    <div class="hidden md:block md:w-1/2 lg:w-3/5 h-full relative">
        <img
            src="/image/login.png"
            alt=""
            aria-hidden="true"
            class="w-full h-full object-cover object-top-left"
        />
        <!-- Soft fade from the image into the form panel -->
        <div class="absolute inset-y-0 right-0 w-24 lg:w-40 bg-linear-to-r from-transparent to-white dark:to-slate-900 pointer-events-none"></div>
    </div>

    <div class="w-full md:w-1/2 lg:w-2/5 h-full p-6 bg-white dark:bg-slate-900 overflow-hidden overflow-y-auto">
        <router-outlet></router-outlet>
    </div>
