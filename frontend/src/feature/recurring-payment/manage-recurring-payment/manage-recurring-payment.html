<header class="border-b border-slate-200 px-6 py-5 dark:border-slate-800 dark:bg-slate-950 bg-white">
    <h2 class="text-lg font-semibold">
        {{ data.mode === 'add' ? 'Add recurring payment' : 'Edit recurring payment' }}
    </h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Schedule a payment that repeats automatically.
    </p>
</header>

<form id="recurring-payment-form"
    class="grid flex-1 grid-cols-1 content-start gap-x-4 gap-y-1 overflow-auto bg-white px-6 py-5 md:grid-cols-2 dark:bg-slate-950"
    [formGroup]="recurringPaymentForm" (ngSubmit)="save()">
    <form-control class="md:col-span-2" name="Name" [control]="nameControl">
        <label for="recurring-payment-name" class="mb-1.5 block text-sm font-medium">Name</label>
        <ui-input name="recurring-payment-name" placeholder="For example, House Rent" formControlName="name" />
    </form-control>

    <form-control class="md:col-span-2" name="Description" [control]="descriptionControl">
        <label for="recurring-payment-description" class="mb-1.5 block text-sm font-medium">Description</label>
        <ui-textarea name="recurring-payment-description" [rows]="3" [maxLength]="300"
            placeholder="Optional notes about this payment" formControlName="description" />
    </form-control>

    <form-control name="Category" [control]="categoryControl">
        <label for="recurring-payment-category" class="mb-1.5 block text-sm font-medium">Category</label>
        <select uiSelect id="recurring-payment-category" class="w-full" formControlName="category">
            <option [ngValue]="null" disabled>Select category</option>
            @for (category of categories(); track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
            }
        </select>
    </form-control>

    <form-control name="Amount" [control]="amountControl">
        <label for="recurring-payment-amount" class="mb-1.5 block text-sm font-medium">Amount</label>
        <ui-input name="recurring-payment-amount" type="number" placeholder="0.00" formControlName="amount" />
    </form-control>

    <form-control name="Recurring" [control]="recurringControl">
        <label for="recurring-payment-recurring" class="mb-1.5 block text-sm font-medium">Recurring</label>
        <select uiSelect id="recurring-payment-recurring" class="w-full" formControlName="recurring">
            <option [ngValue]="null" disabled>Select recurring</option>
            @for (type of recurringTypes; track type) {
            <option [ngValue]="type">{{ type }}</option>
            }
        </select>
    </form-control>

    @if (recurringType() === RecurringType.YEARLY) {
    <form-control name="Month" [control]="monthControl">
        <label for="recurring-payment-month" class="mb-1.5 block text-sm font-medium">Month</label>
        <select uiSelect id="recurring-payment-month" class="w-full" formControlName="month">
            <option [ngValue]="null" disabled>Select month</option>
            @for (month of monthOptions; track month.value) {
            <option [ngValue]="month.value">{{ month.label }}</option>
            }
        </select>
    </form-control>
    }

    @if (recurringType() !== RecurringType.DAILY && recurringType() !== null) {
    <form-control name="Day" [control]="dayControl">
        <label for="recurring-payment-day" class="mb-1.5 block text-sm font-medium">
            {{ recurringType() === RecurringType.WEEKLY ? 'Day of week' : 'Day' }}
        </label>
        <select uiSelect id="recurring-payment-day" class="w-full" formControlName="day">
            <option [ngValue]="null" disabled>
                {{ recurringType() ? 'Select day' : 'Select recurring first' }}
            </option>
            @for (day of dayOptions(); track day.value) {
                <option [ngValue]="day.value">{{ day.label }}</option>
            }
        </select>
    </form-control>
    }

    <form-control name="End date" [control]="endDateControl">
        <label for="recurring-payment-end-date" class="mb-1.5 block text-sm font-medium">
            End date <span class="font-normal text-slate-500 dark:text-slate-400">(optional)</span>
        </label>
        <ui-input name="recurring-payment-end-date" type="date" formControlName="endDate" />
    </form-control>
</form>

<footer
    class="flex justify-end gap-3 border-t border-slate-200 bg-slate-100 px-6 py-4 dark:border-slate-800 dark:bg-slate-900">
    <button uiButton type="button" variant="outline" color="default" size="md" (click)="cancel()">
        Cancel
    </button>
    <button uiButton type="submit" form="recurring-payment-form" variant="filled" size="md">
        {{ data.mode === 'add' ? 'Add payment' : 'Save' }}
    </button>
</footer>
