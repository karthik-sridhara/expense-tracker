<div class="mx-auto w-full max-w-7xl">
    <header class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-950 dark:text-white">
            User Management
        </h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            View and manage application users.
        </p>
    </header>

    <section id="filter" class="mb-4 flex flex-wrap items-center gap-2 md:flex-nowrap">
        <div class="relative w-full">
            <label for="user-search" class="sr-only">Search users</label>
            <ui-input
                type="search"
                name="user-search"
                placeholder="Search by name or email..."
                class="w-full ps-0! md:w-80"
                icon="/icons/search.svg"
                iconPosition="prefix"
                [formControl]="searchTextFormControl"
            />
        </div>

        <select uiSelect id="role-filter"
            class="flex-1 md:w-40 md:flex-none"
            [formControl]="roleFormControl"
        >
            <option value="ALL">All Roles</option>
            @for(role of roles; track role.value){
                <option [value]="role.value">{{role.label}}</option>
            }
        </select>

        <button
            uiButton
            type="button"
            icon="/icons/add_box_fill.svg"
            label="Add User"
            class="ps-0! flex-1 md:flex-none md:ml-auto"
            (click)="onAddUser()"
        >
            Add User
        </button>
    </section>

    <section id="table-section">
        <app-table
            id="user-app-table"
            [colDefs]="userColDefs()"
            [rowData]="userRowData()"
        />
    </section>
</div>
