<header class="border-b border-slate-200 px-6 py-5 dark:border-slate-800 dark:bg-slate-950 bg-white">
    <h2 class="text-lg font-semibold">Reset password</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Set a new password for <span class="font-medium text-slate-700 dark:text-slate-200">{{ data.email }}</span>.
    </p>
</header>

<form id="reset-password-form"
    class="grid grid-cols-1 gap-y-1 bg-white px-6 py-5 dark:bg-slate-950"
    [formGroup]="resetPasswordForm" (ngSubmit)="save()">

    <form-control name="New password" [control]="newPasswordControl">
        <label for="reset-new-password" class="mb-1.5 block text-sm font-medium">New password</label>
        <ui-input name="reset-new-password" type="password" placeholder="New password"
            formControlName="newPassword" />
    </form-control>

    <form-control name="Confirm password" [control]="confirmPasswordControl">
        <label for="reset-confirm-password" class="mb-1.5 block text-sm font-medium">Confirm password</label>
        <ui-input name="reset-confirm-password" type="password" placeholder="Confirm new password"
            formControlName="confirmPassword" />
    </form-control>
</form>

<footer
    class="flex justify-end gap-3 border-t border-slate-200 bg-slate-100 px-6 py-4 dark:border-slate-800 dark:bg-slate-900">
    <button uiButton type="button" variant="outline" color="default" size="md" (click)="cancel()">
        Cancel
    </button>
    <button uiButton type="submit" form="reset-password-form" variant="filled" size="md">
        Reset password
    </button>
</footer>
