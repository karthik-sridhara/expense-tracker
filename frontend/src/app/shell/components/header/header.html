<ng-template #search>
    <ui-input
        class="w-full min-w-20 rounded-xl! bg-white! p-0! border-slate-300! md:min-w-80 lg:min-w-90 dark:bg-slate-950! dark:border-slate-700! ring-slate-200! dark:ring-slate-800!"
        placeholder="Search expenses, categories, notes..."
        icon="/icons/search.svg"
        iconPosition="prefix"
        [formControl]="searchControl"
        [actionIcon]="showSearchClose() ? '/icons/close.svg' : null"
        (action)="clearSearch()"
    />
</ng-template>
<div class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <div class="shrink-0">
        <app-logo />
    </div>

    <div class="flex items-center gap-3">
        <div class="hidden md:block">
            <ng-container [ngTemplateOutlet]="search"></ng-container>
        </div>
        <ui-theme-toggle class="rounded-full! bg-transparent! p-0! hover:bg-slate-200! dark:hover:bg-slate-800!" />
        <button
            uiButton
            type="button"
            id="notification-button"
            variant="ghost"
            color="default"
            size="md"
            icon="/icons/notification.svg"
            iconClass="p-1.5!"
            class="relative rounded-full! bg-transparent! p-0! hover:bg-slate-200! dark:hover:bg-slate-800!"
            aria-label="Notifications"
        >
            @if (notificationCount() > 0) {
                <span class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-primary-600 px-1 text-xs font-semibold text-white">
                    {{ notificationCount() }}
                </span>
            }
        </button>
        <button uiButton
            type="button"
            variant="ghost" 
            color="default" 
            size="md" 
            class=""
            class="gap-2 px-1! sm:pr-2! rounded-full! bg-transparent! hover:bg-slate-200! dark:hover:bg-slate-800!"
            aria-label="Open profile menu"
            (click)="openProfileDialog()"
        >
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-600 text-sm font-bold text-white">
                {{ profileName.charAt(0) | uppercase }}
            </span>
            <span class="hidden text-left sm:block">
                <span class="block text-sm font-semibold text-slate-900 dark:text-white">{{ profileName }}</span>
                <span class="block text-xs text-slate-500 dark:text-slate-400">{{ profileRole }}</span>
            </span>
        </button>
    </div>
</div>
<div class="flex h-13 gap-4 px-4 pb-3 md:hidden">
    <ng-container [ngTemplateOutlet]="search"></ng-container>
</div>
