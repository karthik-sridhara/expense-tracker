

<ng-template #menuButton>
    <button
        uiButton
        type="button"
        variant="ghost"
        color="default"
        size="md"
        [icon]="isMenuOpen() ? '/icons/menu_open.svg' : '/icons/menu.svg'"
        iconClass="p-1!"
        class="p-0! h-9.75! dark:hover:bg-slate-900!"
        aria-label="Toggle navigation"
        aria-controls="side-bar"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="onMenuClick()"
    ></button>
</ng-template>
<div class="flex h-dvh flex-col overflow-hidden bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    
    <header shellHeader></header>

    <main id="layout" 
        class="relative min-h-0 flex-1 overflow-hidden md:grid md:grid-cols-[auto_minmax(0,1fr)]"
    >
        @if (isMenuOpen()) {
            <button
                type="button"
                class="absolute inset-0 z-10 bg-slate-950/35 backdrop-blur-[1px] md:hidden"
                aria-label="Close navigation"
                (click)="onMenuClick()"
            ></button>
        }

        <aside
            id="side-bar"
            class="absolute inset-y-0 left-0 z-20 w-56 overflow-hidden h-full
                border-r border-slate-200 
                bg-slate-100  dark:border-slate-800 dark:bg-slate-900 shadow-xl
                transition-transform duration-200 ease-out
                md:relative md:z-auto md:shrink-0 md:translate-x-0
                md:transition-[width] md:shadow-none
            "
            [ngClass]="{
                'visible translate-x-0 md:w-56': isMenuOpen(),
                'invisible -translate-x-full md:visible md:w-14 md:translate-x-0': !isMenuOpen()
            }"
        >
            <div class="flex items-center justify-end px-2">
                <ng-container [ngTemplateOutlet]="menuButton"></ng-container>
            </div>
            <ui-divider></ui-divider>
            <nav
                class="flex flex-col gap-1 px-2 py-3"
                aria-label="Primary navigation"
            >
                @for (menu of menus; track $index) {
                    <button
                        uiButton
                        type="button"
                        size="md"
                        variant="ghost"
                        iconClass="h-6! w-6! shrink-0 p-0!"
                        class="relative w-full overflow-hidden rounded-md! p-2! transition-colors duration-150"
                        [color]="'text-slate-700 hover:bg-slate-200 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white'"
                        [ngClass]="{
                            'justify-center!': !isMenuOpen(),
                            'justify-start! gap-3! px-3!': isMenuOpen()
                        }"
                        [icon]="menu['icon']"
                        [aria-label]="menu['name']"
                        [attr.title]="isMenuOpen() ? null : menu['name']"
                        [routerLink]="menu['route']"
                        [routerLinkActive]="'bg-primary-600! text-white! hover:bg-primary-700! dark:bg-primary-500! dark:text-slate-950! dark:hover:bg-primary-400!'"
                        [routerLinkActiveOptions]="{ exact: true }"
                        (click)="onMenuItemClick(menu)"
                    >
                        @if (isMenuOpen()) {
                            <span class="truncate text-sm font-semibold">
                                {{ menu['name'] }}
                            </span>
                        }
                    </button>
                }
            </nav>

        </aside>

        <section id="main-container" 
            class="flex h-full min-h-0 min-w-0 flex-col overflow-hidden"
        >
            <div id="breadcrumb" 
                class="z-10 flex h-10 items-center border-b border-slate-200 bg-slate-100 px-2 backdrop-blur dark:border-slate-800 dark:bg-slate-900"
            >
                <div class="md:hidden">
                    <ng-container [ngTemplateOutlet]="menuButton"></ng-container>
                </div>
            </div>

            <div id="content" class="w-full px-4 py-6 sm:px-6 lg:px-8 overflow-y-auto">
                <router-outlet></router-outlet>
            </div>
        </section>
    </main>
</div>
