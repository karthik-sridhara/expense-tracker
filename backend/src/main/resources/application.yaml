spring:
  application:
    name: Expense Tracker
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: UTC
app:
  config:
    cors:
      origin: http://localhost:4200, http://localhost:3000
  recurring:
    cron: "0 5 0 * * *"              # nightly at 00:05 in the zone below
    zone: Pacific/Kiritimati         # UTC+14, first zone to start a new day (cron + generation "today")
    validation-zone: Etc/GMT+12      # UTC-12, last zone (used for "date in the past?" checks)
    run-on-startup: true             # catch up missed runs when the app starts
  logging:
    dir: logs
    level:
      root: INFO
      app: TRACE
      audit: INFO
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_DOC:false}
  api-docs:
    enabled: ${SWAGGER_DOC:false}
jwt:
  expiration: 3600
  secret: ${JWT_SECRET}
server:
  port: 9090